version: '3.8'
services:
  accent-server:
    build: ./server
    environment:
      - ICLOUD_USERNAME=${ICLOUD_USERNAME}
      - ICLOUD_APP_PASSWORD=${ICLOUD_APP_PASSWORD}
      - ACCENT_DEVICE_KEY=${ACCENT_DEVICE_KEY}
      - ACCENT_DEFAULT_WIDTH=${ACCENT_DEFAULT_WIDTH:-1304}
      - ACCENT_DEFAULT_HEIGHT=${ACCENT_DEFAULT_HEIGHT:-984}
    ports:
      - "8080:8080"
